name: Rust checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets --verbose
      - name: Bisq Easy scenarios
        run: cargo run --quiet -- all | tee bisq-easy-results.jsonl
      - name: MuSig-inspired scenarios
        run: cargo run --quiet -- simulate --profile bisq-musig all | tee bisq-musig-results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: arena-results
          path: '*-results.jsonl'
