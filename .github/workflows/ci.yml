name: Rust checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR branches receive one CI run per commit; main stays protected.
# Superseded commits are cancelled rather than consuming duplicate runners.
concurrency:
  group: rust-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets --verbose
      - name: Bisq Easy scenarios
        run: cargo run --quiet -- all | tee bisq-easy-results.jsonl
      - name: MuSig-inspired scenarios
        run: cargo run --quiet -- simulate --profile bisq-musig all | tee bisq-musig-results.jsonl
      - name: Cashout profiles (BAN contract ban-arena-cashout/1)
        run: |
          set -o pipefail
          cargo run --quiet -- simulate --profile cashout-btc-first all | tee cashout-btc-first-results.jsonl
          cargo run --quiet -- simulate --profile cashout-bisq-easy all | tee cashout-bisq-easy-results.jsonl
          cargo run --quiet -- cashout-import fixtures/ban/cashout_scenarios.jsonl | tee cashout-import-results.jsonl
      - name: Seeded Bisq marketplace (reputation policy)
        run: cargo run --quiet -- swarm --seed 7 --rounds 48 --trace | tee swarm-reputation-results.jsonl
      - name: Seeded Bisq marketplace (price policy)
        run: cargo run --quiet -- swarm --seed 7 --rounds 48 --policy price --trace | tee swarm-price-results.jsonl
      - name: Paired buyer-policy comparison
        run: cargo run --quiet -- swarm-compare --seed 42 --rounds 64 --trace | tee swarm-comparison-results.jsonl
      - name: Rust control gateway (strict and vulnerable fixtures)
        run: |
          cargo run --quiet -- control paid strict observe,confirm,send | tee control-paid-results.jsonl
          cargo run --quiet -- control unpaid strict trust-claim,confirm,send,decline | tee control-strict-results.jsonl
          cargo run --quiet -- control unpaid legacy trust-claim,confirm,send | tee control-legacy-results.jsonl
      - name: Python bridge tests
        run: python -m unittest discover -s tests -p 'test_gateway.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: arena-results
          path: '*-results.jsonl'


  bisq-two-node-interface:
    name: Paired Bisq API / WebSocket contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional WebSocket client
        run: python -m pip install -e '.[bisq2]'
      - name: Validate pairing, two-node launcher, WebSocket and regtest link
        run: python -m unittest discover -s tests -p 'test_bisq_pair.py' -v
      - name: Validate Python module import and CLI plan
        run: |
          python -m compileall -q controlarena_adapter
          python -m controlarena_adapter.bisq_two_node --bisq-root . --plan
          python -m controlarena_adapter.bisq_correlate --help

  bisq-upstream-smoke:
    name: Upstream Bisq 2 seed / Alice / Bob bootstrap
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[bisq-live-smoke]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Bisq 2 upstream commit
        uses: actions/checkout@v4
        with:
          repository: bisq-network/bisq2
          ref: 7767b8b3196b9e8be0a1413c2237f4f595b86cc0
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Bisq 2 WebSocket client
        run: python -m pip install -e '.[bisq2]'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build upstream seed and API application distributions
        working-directory: upstream
        run: ./gradlew :apps:seed-node-app:installDist :apps:api-app:installDist --no-daemon --console=plain -x test
      - name: Verify two-node command plan
        run: python -m controlarena_adapter.bisq_two_node --bisq-root upstream --plan
      - name: Start three isolated Bisq processes and pair both API clients
        run: |
          set -o pipefail
          python -m controlarena_adapter.bisq_two_node \
            --bisq-root upstream --launch --port-base 18500 --probe-subscriptions --hold 0 \
            | tee bisq-upstream-smoke.jsonl
          python -c "import json; r=json.load(open('bisq-upstream-smoke.jsonl')); assert r['kind']=='bisq_pair_started' and r['paired_client_count']==2 and r['node_count']==3 and r['websocket_subscriptions_verified']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bisq-upstream-boot-report
          path: bisq-upstream-smoke.jsonl
          if-no-files-found: ignore

  bitcoin-regtest:
    name: Bitcoin Core 31.1 regtest payout and reorg
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests for regtest safety and Bisq observer
        run: python -m unittest discover -s tests -p 'test_regtest.py' -v
      - name: Build Rust reference-model binary
        run: cargo build
      - name: Start loopback-published disposable regtest Core
        run: |
          docker run -d --rm --name rtg-regtest-ci \
            -p 127.0.0.1:18443:18443 \
            bitcoin/bitcoin:31.1 \
            -regtest=1 -server=1 -listen=0 -dnsseed=0 -connect=0 \
            -rpcbind=0.0.0.0 -rpcallowip=0.0.0.0/0 -rpcport=18443 \
            -rpcuser=rtgci -rpcpassword=isolated_regtest_ci_only \
            -fallbackfee=0.0002 -txindex=1 -printtoconsole=1
      - name: Pay 100k sats and survive regtest reorg
        env:
          P2P_REGTEST_RPC_USER: rtgci
          P2P_REGTEST_RPC_PASSWORD: isolated_regtest_ci_only
        run: |
          set -o pipefail
          python -m controlarena_adapter.bitcoin_regtest \
            --wallet-prefix ci-regtest --wait-seconds 90 --reorg \
            | tee regtest-settlement-results.jsonl
          python -c "import json; r=json.load(open('regtest-settlement-results.jsonl')); assert r['passed'] and r['reorg_detected'] and r['received_sats']==100000 and r['confirmations']>=1"

      - name: Regtest bitcoind diagnostics on failure
        if: failure()
        run: docker logs --tail 100 rtg-regtest-ci || true
      - name: Stop disposable regtest node
        if: always()
        run: docker rm -f rtg-regtest-ci || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regtest-settlement-results
          path: regtest-settlement-results.jsonl
          if-no-files-found: ignore

  controlarena-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional AISI ControlArena SDK
        run: python -m pip install -e '.[controlarena]'
      - name: Exercise custom Setting API
        run: python -m unittest discover -s tests -p 'test_setting.py' -v
      - name: Compile trusted Rust replay engine before Inspect samples
        run: cargo build
      - name: Model-free end-to-end Inspect sample evaluation
        run: python -m controlarena_adapter.smoke
